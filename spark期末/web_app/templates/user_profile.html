<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - {{ username }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav-bar {
            background: #f8f9fa;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dee2e6;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .content {
            padding: 40px;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            min-width: 120px;
        }

        .info-value {
            flex: 1;
            color: #333;
            font-size: 1.1em;
        }

        .edit-form {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input:disabled {
            background: #e9ecef;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .nav-bar {
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>👤 个人资料</h1>
            <p>查看和编辑您的个人信息</p>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="/user/dashboard" class="nav-btn">📊 返回首页</a>
                <a href="/user/profile" class="nav-btn" style="background: #667eea; color: white;">👤 个人资料</a>
            </div>
            <button onclick="logout()" class="nav-btn logout-btn">退出登录</button>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 消息提示 -->
            <div id="message" class="message"></div>

            <!-- 统计信息 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="searchCount">-</div>
                    <div class="stat-label">搜索次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="favoriteCount">-</div>
                    <div class="stat-label">关注股票</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="memberDays">-</div>
                    <div class="stat-label">会员天数</div>
                </div>
            </div>

            <!-- 基本信息 -->
            <div class="profile-section">
                <h2 class="section-title">📋 基本信息</h2>
                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">用户ID：</span>
                        <span class="info-value" id="userId">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">用户名：</span>
                        <span class="info-value" id="username">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">注册时间：</span>
                        <span class="info-value" id="registerTime">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">最后登录：</span>
                        <span class="info-value" id="lastLogin">-</span>
                    </div>
                </div>
            </div>

            <!-- 联系信息 -->
            <div class="profile-section">
                <h2 class="section-title">📧 联系信息</h2>
                <div class="edit-form">
                    <div class="form-group">
                        <label for="email">邮箱地址：</label>
                        <input type="email" id="email" placeholder="请输入邮箱地址">
                    </div>
                    <div class="form-group">
                        <label for="phone">手机号码：</label>
                        <input type="tel" id="phone" placeholder="请输入手机号码（选填）">
                    </div>
                    <div class="btn-group">
                        <button onclick="updateProfile()" class="btn btn-primary">💾 保存修改</button>
                        <button onclick="loadProfile()" class="btn btn-secondary">🔄 重新加载</button>
                    </div>
                </div>
            </div>

            <!-- 修改密码 -->
            <div class="profile-section">
                <h2 class="section-title">🔒 修改密码</h2>
                <div class="edit-form">
                    <div class="form-group">
                        <label for="oldPassword">当前密码：</label>
                        <input type="password" id="oldPassword" placeholder="请输入当前密码">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码：</label>
                        <input type="password" id="newPassword" placeholder="请输入新密码">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码：</label>
                        <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                    </div>
                    <div class="btn-group">
                        <button onclick="changePassword()" class="btn btn-success">🔐 修改密码</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取用户信息
        window.onload = function() {
            loadProfile();
            loadStats();
        };

        // 加载用户资料
        async function loadProfile() {
            try {
                const response = await fetch('/api/user/profile');
                const result = await response.json();

                if (result.success) {
                    document.getElementById('userId').textContent = result.data.id;
                    document.getElementById('username').textContent = result.data.username;
                    document.getElementById('registerTime').textContent = result.data.register_time || '-';
                    document.getElementById('lastLogin').textContent = result.data.last_login || '-';
                    document.getElementById('email').value = result.data.email || '';
                    document.getElementById('phone').value = result.data.phone || '';
                } else {
                    showMessage('加载失败：' + result.error, 'error');
                }
            } catch (error) {
                console.error('加载资料失败:', error);
                showMessage('加载失败，请刷新页面重试', 'error');
            }
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch('/api/user/stats');
                const result = await response.json();

                if (result.success) {
                    document.getElementById('searchCount').textContent = result.data.search_count || 0;
                    document.getElementById('favoriteCount').textContent = result.data.favorite_count || 0;
                    document.getElementById('memberDays').textContent = result.data.member_days || 0;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // 更新个人资料
        async function updateProfile() {
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!email) {
                showMessage('邮箱地址不能为空', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        phone: phone
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ 资料更新成功！', 'success');
                    setTimeout(() => {
                        loadProfile();
                    }, 1000);
                } else {
                    showMessage('更新失败：' + result.error, 'error');
                }
            } catch (error) {
                console.error('更新失败:', error);
                showMessage('更新失败，请稍后重试', 'error');
            }
        }

        // 修改密码
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                showMessage('请填写所有密码字段', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('两次输入的新密码不一致', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('新密码长度不能少于6位', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ 密码修改成功！请重新登录', 'success');
                    
                    // 清空表单
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';

                    // 3秒后退出登录
                    setTimeout(() => {
                        logout();
                    }, 3000);
                } else {
                    showMessage('修改失败：' + result.error, 'error');
                }
            } catch (error) {
                console.error('修改密码失败:', error);
                showMessage('修改失败，请稍后重试', 'error');
            }
        }

        // 显示消息
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            // 3秒后自动隐藏
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = '/user/login';
            }
        }
    </script>
</body>
</html>
